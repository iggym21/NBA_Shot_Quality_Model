[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-shot-quality"
version = "0.1.0"
description = "NBA shot quality model — XGBoost classifier predicting shot make probability"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nba_api>=1.4.1",
    "pandas>=2.0.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
"ipywidgets>=8.0.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
